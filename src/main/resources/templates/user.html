<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Usuários</title>

	<!-- SEO Optimization -->
	<meta name="description" content="Consorcio Sistema Manoel Santiago Pinheiro Neto Dev Java">
	<meta name="author" content="Manoel Santiago Pinheiro Neto">

	<!-- Favicon -->
	<link rel="icon" th:href="@{/assets/images/favicon.ico}">


	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
	<link rel="stylesheet" th:href="@{/assets/libs/apexcharts/apexcharts.css}">
	<link rel="stylesheet" th:href="@{/assets/libs/flatpickr/flatpickr.min.css}">
	<link rel="stylesheet" th:href="@{/assets/css/main.css}">

		<th:block th:replace="~{fragments/csrf :: csrf}"></th:block>
</head>

<body>

	<!-- Inserir o menu aqui -->
	<div id="menu" th:data-url="@{/fragments/menu}">
	</div>
	<!-- Inserir o menu aqui -->


	<!-- ==========================================
         START: Main Content Area
         ========================================== -->
	<div class="main-wrapper">


		<!-- Inserir top nav bar -->
		<div id="topnavbar" th:attr="data-url=@{/fragments/topnavbar}">
		</div>
		<!-- Inserir top nav bar -->


		<!-- ==========================================
  COMEÇAR A PÁGINA DAQUI
   ========================================== -->


		<!-- START: Main Layout Grid (2 Columns: Dashboard + Performance Pane) -->
		<div class="row g-4">


			<!-- TOP AREA: Quick Info Stat Cards Row (Full Width) -->

			<!-- Login Form -->
			<div class="card border-light shadow-sm p-4 h-100">

				<h5 class="card-title mb-4">Cadastro de Usuário</h5>

				<form id="usuarioForm" class="needs-validation" novalidate>

					<!-- codigo do usuario -->
					<div class="login-form-group" id="divId" th:style="${usuario.id != null} ? 'display:block' : 'display:none'">
						<label for="id" class="login-form-label">Código do Usuário:</label>
						<div class="login-input-group">
							<i class="bi bi-database input-icon"></i>
							<input type="text" id="id" class="login-input" th:value="${usuario.id ?: ''}"
								readonly>
						</div>
					</div>




					<div class="login-form-group">
						<label for="nome" class="login-form-label">Nome Completo</label>
						<div class="login-input-group">
							<i class="bi bi-pencil-square input-icon"></i>
							<input type="text" id="nome" name="nome" class="login-input" placeholder="nome completo" th:value="${usuario.nome ?: ''}"
								required>
						</div>
					</div>


					<div class="login-form-group">
						<label for="cpf" class="login-form-label">CPF</label>
						<div class="login-input-group">
							<i class="bi bi-view-list input-icon"></i>
							<input type="text" inputmode="numeric" maxlength="14" id="cpf" name="cpf"
								class="login-input" placeholder="000.000.000-00" th:value="${usuario.cpf ?: ''}" required>
						</div>
					</div>
					
					
					<div class="login-form-group">
						<label for="cpf" class="login-form-label">Telefone</label>
						<div class="login-input-group">
							<i class="bi bi-telephone-plus input-icon"></i>
							<input type="text" inputmode="numeric" maxlength="15" id="telefone" name="telefone"
								class="login-input" placeholder="(99)99999-9999" th:value="${usuario.telefone ?: ''}" required>
						</div>
					</div>


					<div class="login-form-group">
						<label for="email" class="login-form-label">Endereço de Email</label>
						<div class="login-input-group">
							<i class="bi bi-envelope input-icon"></i>
							<input type="email" id="email" name="email" class="login-input"
								placeholder="endereco@email.com" th:value="${usuario.email ?: ''}" required>
						</div>
					</div>

					<!-- Campo senha com olhinho -->
					<div class="login-form-group">
						<label for="senha" class="login-form-label">Senha</label>
						<div class="login-input-group">
							<i class="bi bi-shield-lock input-icon"></i>
							<input type="password" maxlength="8" inputmode="numeric" id="senha" name="senha"
								class="login-input login-input-password" placeholder="min 4 números">

							<button type="button" class="password-toggle-btn" id="toggle-password"
								aria-label="Mostra senha">
								<i class="bi bi-eye"></i>
							</button>
						</div>
					</div>
					
					<div th:if="${usuario.dataCadastro != null}" class="login-form-group" id="divDataCadastro">
						<label for="email" class="login-form-label">Data de Cadastro</label>
						<div class="login-input-group"> 
							<i class="bi bi-calendar2 input-icon"></i>
							<input type="text" id="dataCadastro" class="login-input"
								th:value="${#temporals.format(usuario.dataCadastro, 'dd/MM/yyyy') ?: ''}" readonly>
						</div>
					</div>

					<div class="form-switch-custom">
						<!-- situacao ativo true ou false-->
						<input class="form-switch-input-custom" type="checkbox" id="situacao" 
							th:checked="${usuario.situacao} ?: false" th:disabled="${#authorization.expression('hasRole(''USER'')')}">
						<label class="form-switch-label" for="situacao">Usuário ativo</label>
					</div>

					<div class="form-switch-custom">
						<!-- administrador true ou false -->
						<input class="form-switch-input-custom" type="checkbox" id="administrador" 
							th:checked="${usuario.administrador} ?: false" th:disabled="${#authorization.expression('hasRole(''USER'')')}">
						<label class="form-switch-label" for="administrador">Perfil Administrador</label>
					</div>


					<!-- Submit Button -->
					<div>
						<button style="margin-top: 20px;" type="submit" class="btn-custom btn-custom-primary"
							id="btn-salvar">
							<i class="bi bi-floppy"></i>
							<span>Salvar</span>
						</button>
						
						<button sec:authorize="hasRole('ADMIN')" class="btn-custom btn-custom-secondary" style="margin-left: 10px;" type="button" onclick="listarUsuarios()">Listar Usuários<i class="bi bi-person-up"></i></button>
						
						<button sec:authorize="hasRole('ADMIN')" class="btn-custom btn-custom-light" style="margin-left: 10px;" type="button" onclick="limpar()">
						  Novo<i class="bi bi-three-dots"></i>
						</button>
						
					</div>
					<div style="margin-top: 20px; margin-left: 20px;"><span
							style="font-size: 11px; color: rgb(0, 64, 0)" id="msg"></span></div>

				</form>
			</div>


			<!-- END: TOP AREA -->



			<!-- FOOTER  -->
			<footer class="footer-custom" style="margin-top: 45px;">
				<div class="footer-left">
					<span class="footer-logo">
						<i class="bi bi-globe-americas"></i>
						Controle de Usuário
					</span>

					<span class="footer-separator">|</span>

					<span class="footer-copy">
						&copy; 2026 Santiago Sistemas
					</span>
				</div>
			</footer>
			<!-- END: Footer Component -->
		</div>

		<!-- ==========================================
         END: Main Content Area
         ========================================== -->




<!-- Bibliotecas Script -->
<script th:src="@{/assets/libs/jquery/jquery-4.0.0.min.js}"></script>
<script th:src="@{/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/libs/apexcharts/apexcharts.min.js}"></script>
<script th:src="@{/assets/libs/flatpickr/flatpickr.min.js}"></script>
<script th:src="@{/assets/js/csrf.js}"></script>

<!-- Biblioteca dashboard  -->
<script th:src="@{/assets/js/dashboard.js}"></script>

<!-- SCRIPT DOS MENUS -->
<script th:inline="javascript">
	$(document).ready(function () {

		const menuUrl = $("#menu").attr("data-url");
		const navbarUrl = $("#topnavbar").attr("data-url");

		$("#menu").load(menuUrl, function (response, status, xhr) {
			if (status === "error") {
				console.error("Erro ao carregar menu:", xhr.status, menuUrl);
			}
		});

		$("#topnavbar").load(navbarUrl, function (response, status, xhr) {
			if (status === "error") {
				console.error("Erro ao carregar topnavbar:", xhr.status, navbarUrl);
			}
		});

	});
</script>
<!-- SCRIPT DOS MENUS -->


<!-- CONFIG PARA AS URLS NÃO QUEBRAREM NO SERVIDOR -->
<div id="config"
     th:attr="data-salvar-url=@{/api/usuario/salvar},
              data-listar-url=@{/usuarios}">
</div>


<script>
	
//Olho da senha visível ou não
const senha = document.getElementById("senha");
const togglePassword = document.getElementById("toggle-password");
const icone = togglePassword.querySelector("i");

togglePassword.addEventListener("click", function () {

    if (senha.type === "password") {
        // Mostrar a senha
        senha.type = "text";

        // Trocar para o ícone de olho fechado
        icone.classList.remove("bi-eye");
        icone.classList.add("bi-eye-slash");

        togglePassword.setAttribute("aria-label", "Ocultar senha");

    } else {
        // Ocultar a senha
        senha.type = "password";

        // Voltar para o ícone de olho aberto
        icone.classList.remove("bi-eye-slash");
        icone.classList.add("bi-eye");

        togglePassword.setAttribute("aria-label", "Mostrar senha");
    }

});


//URLS PARA USAR NOS CÓDIGOS
const config = document.getElementById("config");

const salvarUrl = config.dataset.salvarUrl;
const listarUrl = config.dataset.listarUrl;

	
//limpar
function limpar(){
	const campos = [
	"id",
	"nome",
	"cpf",
	"email",
	"telefone",
	"senha",
	"situacao",
	"administrador",
	"dataCadastro"
	]
	
	campos.forEach(function (campoId) {
	    const campo = document.getElementById(campoId);

	    if (!campo) return;

	    if (campo.type === "checkbox") {
	        campo.checked = false;
	    } else {
	        campo.value = "";
	    }
	});
	
	const divId = document.getElementById("divId");
	const divDataCadastro = document.getElementById("divDataCadastro");

	if (divId) divId.style.display = "none";
	if (divDataCadastro) divDataCadastro.style.display = "none";
	
	let mensagem = document.getElementById("msg");
	mensagem.textContent = '';
	mensagem.className = '';
}
	


// Página lista de usuários
function listarUsuarios(){
	window.location.href =listarUrl;
}


	
//Script que formata o CPF
const cpf = document.getElementById("cpf");

cpf.addEventListener("input", function () {

    let valor = this.value.replace(/\D/g, "");

    valor = valor.substring(0, 11);

    valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
    valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
    valor = valor.replace(/(\d{3})(\d{1,2})/,"$1-$2");

    this.value = valor;
});


//Script que formata o Telefone
const telefone = document.getElementById("telefone");

telefone.addEventListener("input", function () {

    let valor = this.value.replace(/\D/g, "");

    valor = valor.substring(0, 11);

	if (valor.length > 10) {
	    // Celular: (99) 99999-9999
	    valor = valor.replace(/^(\d{2})(\d{5})(\d{1,4})$/, "($1) $2-$3");
	} else if (valor.length > 6) {
	    // Telefone fixo: (99) 9999-9999
	    valor = valor.replace(/^(\d{2})(\d{4})(\d{1,4})$/, "($1) $2-$3");
	} else if (valor.length > 2) {
	    valor = valor.replace(/^(\d{2})(\d+)$/, "($1) $2");
	} else if (valor.length > 0) {
	    valor = valor.replace(/^(\d+)$/, "($1");
	}
	
    this.value = valor;
});


	
//AJAX COMPLETO QUE SALVA O FORMULÁRIO E TRATA ERROS
document.getElementById("usuarioForm").addEventListener("submit", async function (event) {

	// Evita que formulário seja tratado com os eventos comuns
	event.preventDefault();


	//Captura as variáveis
	const formulario = this;
	const mensagem = document.getElementById("msg");
	mensagem.textContent = "";



	// Verifica se todos os campos são válidos
	if (!formulario.reportValidity()) {
		return; // Interrompe a execução e não chama o AJAX
	}



	// Se todos os campos foram válidos continua a execução
	const usuario = {
		id: document.getElementById("id").value || null,
		nome: document.getElementById("nome").value,
		cpf: document.getElementById("cpf").value,
		email: document.getElementById("email").value,
		senha: document.getElementById("senha").value,
		situacao: document.getElementById("situacao").checked,
		administrador: document.getElementById("administrador").checked,
		telefone: document.getElementById("telefone").value

	};

	try {
		const response = await fetch(salvarUrl, {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify(usuario)
		});



		// Lê a resposta como texto, independentemente do status
		const texto = await response.text();

		if (!response.ok) {
			// Erro retornado pela API
			mensagem.textContent = texto;
			mensagem.className = "alert alert-danger";
			return;
		}


		

		// se der certo
		// Converte o JSON recebido em objeto JavaScript
		const usuarioSalvo = JSON.parse(texto);
		
		document.getElementById("divId").style.display = 'block';

		// Preenche os campos com os dados retornados
		document.getElementById("id").value = usuarioSalvo.id ?? "";
		document.getElementById("nome").value = usuarioSalvo.nome ?? "";
		document.getElementById("cpf").value = usuarioSalvo.cpf ?? "";
		document.getElementById("email").value = usuarioSalvo.email ?? "";
		document.getElementById("senha").value = "";
		document.getElementById("telefone").value = usuarioSalvo.telefone ?? "";
		document.getElementById("situacao").checked = usuarioSalvo.situacao;
		document.getElementById("administrador").checked = usuarioSalvo.administrador;

		mensagem.textContent = "Usuário salvo com sucesso";
		mensagem.className = "alert alert-success";
		


		// Se der algum exception
	} catch (error) {
		mensagem.textContent = "Não foi possível conectar ao servidor.";
		mensagem.className = "alert alert-danger";
		console.error(error);
	}

});




</script>

</body>

</html>
