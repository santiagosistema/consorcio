		<!-- NOTIFICAÇÕES SINO -->
		<div class="dropdown">

		    <button class="navbar-action-btn dropdown-toggle"
		            type="button"
		            data-bs-toggle="dropdown"
		            aria-expanded="false"
		            id="btn-notifications"
		            data-bs-auto-close="outside">

		        <i class="bi bi-bell"></i>

		        <!-- CONTADOR DE NOTIFICAÇÕES NÃO LIDAS -->
		        <span class="navbar-action-badge"
		              th:if="${notificacoesNaoLidas != null and notificacoesNaoLidas > 0}"
		              th:text="${notificacoesNaoLidas}">
		            0
		        </span>

		    </button>

		    <div class="dropdown-menu dropdown-menu-end dropdown-menu-notification p-0"
		         aria-labelledby="btn-notifications">

		        <!-- CABEÇALHO -->
		        <div class="notification-header">

		            <h6 class="notification-title">Notificações</h6>

		            <button class="btn-clear-all"
		                    type="button"
		                    id="btn-marcar-todas-lidas">
		                Marcar todas lidas
		            </button>

		        </div>

		        <!-- LISTA DE NOTIFICAÇÕES -->
		        <div class="notification-list">

		            <!-- NENHUMA NOTIFICAÇÃO -->
		            <div th:if="${#lists.isEmpty(notificacoes)}"
		                 class="notification-item">

		                <div class="notification-content">
		                    <p class="notification-text">
		                        Você não tem notificações no momento.
		                    </p>
		                </div>

		            </div>

		            <!-- NOTIFICAÇÕES DO BANCO DE DADOS -->
					<a th:each="notificacao : ${notificacoes}"
					th:href="${notificacao.urlDestino != null ? notificacao.urlDestino : '#'}"
					th:attr="data-notificacao-id=${notificacao.id}"
					class="notification-item"
					th:classappend="${!notificacao.lida ? ' notification-unread' : ''}">

		                <!-- ÍCONE -->
		                <div class="notification-icon bg-primary text-white">
		                    <i class="bi bi-bell-fill"></i>
		                </div>

		                <!-- CONTEÚDO -->
		                <div class="notification-content">

		                    <p class="notification-text"
		                       th:text="${notificacao.titulo}">
		                        Título da notificação
		                    </p>

		                    <p class="notification-text"
		                       th:text="${notificacao.mensagem}">
		                        Mensagem da notificação
		                    </p>

		                    <span class="notification-time"
		                          th:if="${notificacao.dataCriacao != null}"
		                          th:text="${#temporals.format(notificacao.dataCriacao, 'dd/MM/yyyy')}">
		                        24/10/2026
		                    </span>

		                </div>

		                <!-- INDICADOR DE NÃO LIDA -->
		                <span class="notification-unread-dot"
		                      th:if="${!notificacao.lida}">
		                </span>

		            </a>

		        </div>

		        <!-- RODAPÉ -->
		        <a th:href="@{/notificacoes}"
		           class="notification-footer">
		            Ver todas as notificações
		        </a>

		    </div>

		</div>
